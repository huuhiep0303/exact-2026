# EXACT 2026 - Type 1 Configuration

# Data paths
data:
  raw_data_path: "EXACT2026_dataset_2026-05-15/Logic_Based_Educational_Queries_Text_Only/Logic_Based_Educational_Queries.json"
  processed_dir: "outputs/processed_data"
  train_file: "outputs/processed_data/train_fixed.json"
  val_file: "outputs/processed_data/val_fixed.json"
  test_file: "outputs/processed_data/test_fixed.json"

# Data split ratios
split:
  train: 0.70
  val: 0.15
  test: 0.15
  random_seed: 42

# Model configuration — Qwen3-8B (8.2B params, <8B non-embedding)
model:
  name: "Qwen/Qwen3-8B"
  max_length: 3072
  # Qwen3 thinking mode recommended settings
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  do_sample: false
  # Enable thinking mode to leverage Qwen3's native CoT
  enable_thinking: true

# LoRA configuration
lora:
  r: 64
  lora_alpha: 128
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Training configuration
training:
  output_dir: "outputs/checkpoints"
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 20
  warmup_ratio: 0.05
  logging_steps: 10
  eval_steps: 30
  save_steps: 60
  save_total_limit: 5
  fp16: true
  optim: "paged_adamw_8bit"
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0

# Quantization
quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# Inference configuration
inference:
  batch_size: 8
  max_new_tokens: 2048
  num_beams: 1
  # Qwen3 thinking mode recommended settings
  temperature: 0.6
  top_p: 0.95

# Evaluation configuration
evaluation:
  metrics:
    - "accuracy"
    - "premise_f1"
    - "reasoning_quality"
  reasoning_sample_size: 200

# Logging
logging:
  use_wandb: false
  wandb_project: "exact-2026-type1"
  wandb_run_name: "qwen3-lora-v2"
  log_dir: "outputs/logs"

# Paths
paths:
  checkpoint_dir: "outputs/checkpoints"
  results_dir: "outputs/results"
  logs_dir: "outputs/logs"
